apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  namespace: roboshop
  labels:
    project: roboshop
    purpose: multi-container-demo
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
    - name: almalinux-container
      image: almalinux:9
      command: ["sleep", "1000"]
