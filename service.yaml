apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    purpose: Service-demo
spec:
  selector:
    purpose: Service-demo
    project: roboshop
    environment: dev
  ports:
    - protocol: TCP
      port: 80        # Service port
      targetPort: 80  # Container port

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    purpose: Service-demo
    project: roboshop
    environment: dev
spec:
  containers:
    - name: nginx
      image: nginx
